<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks Hub | Studio</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hub-bg { background-color: #0b0f19; }
    .hub-card { background-color: #111827; border: 1px solid #1f2937; }
    .hub-sidebar { background-color: #0d121f; border-right: 1px solid #1f2937; }
  </style>
</head>
<body class="hub-bg text-gray-200 antialiased h-screen flex overflow-hidden font-sans select-none">

  <!-- RESIZABLE SIDEBAR -->
  <aside id="sidebar" class="hub-sidebar w-64 flex-shrink-0 flex flex-col justify-between transition-all duration-75 relative z-20" style="width: 260px; min-width: 72px; max-width: 450px;">
    <div class="p-4 flex flex-col h-full overflow-hidden">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3 sidebar-content overflow-hidden">
          <div class="w-10 h-10 rounded-xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 flex-shrink-0">
            <span class="material-symbols-outlined text-2xl">bookmark</span>
          </div>
          <div class="truncate">
            <h1 class="font-bold text-base tracking-wide text-white truncate">BOOKMARKS</h1>
            <p class="text-xs text-gray-400 font-mono truncate">HUYN STUDIO</p>
          </div>
        </div>
        <button onclick="toggleSidebar()" class="p-1.5 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white flex-shrink-0">
          <span class="material-symbols-outlined text-2xl" id="toggle-icon">menu_open</span>
        </button>
      </div>

      <div class="flex-grow overflow-y-auto no-scrollbar space-y-1">
        <div class="flex items-center justify-between px-2 py-1.5 text-xs font-semibold text-gray-400 uppercase tracking-wider sidebar-content">
          <span>Categories</span>
          <button onclick="openCategoryModal()" class="hover:text-indigo-400"><span class="material-symbols-outlined text-lg">add</span></button>
        </div>

        <button onclick="filterCategory(null)" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-gray-300 hover:bg-gray-800/60 transition active-cat" id="cat-all">
          <span class="material-symbols-outlined text-xl text-indigo-400 flex-shrink-0">border_all</span>
          <span class="sidebar-content truncate">All Links</span>
        </button>

        <div id="category-list" class="space-y-1"></div>
      </div>

      <div class="pt-4 border-t border-gray-800/80 flex items-center gap-3 sidebar-content">
        <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-sm font-bold text-white flex-shrink-0">H</div>
        <div class="truncate flex-grow">
          <p class="text-sm font-medium text-white truncate">Huy Nguyen</p>
          <p class="text-xs text-gray-400 truncate">Admin Engine</p>
        </div>
      </div>
    </div>
    <div id="resizer" class="absolute top-0 right-0 w-1.5 h-full cursor-col-resize hover:bg-indigo-500/50 transition"></div>
  </aside>

  <!-- MAIN WORKSPACE -->
  <main class="flex-grow flex flex-col h-full min-w-0 bg-[#0b0f19]">
    <header class="h-16 border-b border-gray-800/80 flex items-center justify-between px-6 bg-[#0b0f19]/80 backdrop-blur gap-4">
      <div class="flex items-center gap-4 flex-grow">
        <div class="relative w-full max-w-xl">
          <span class="material-symbols-outlined absolute left-3 top-3 text-gray-500 text-xl">search</span>
          <input type="text" id="search-input" onkeyup="renderBookmarks()" placeholder="Search workspace tools, links..." 
            class="w-full bg-gray-900/80 border border-gray-800 rounded-lg pl-10 pr-4 py-2 text-sm text-gray-200 focus:outline-none focus:border-indigo-500 transition">
        </div>
      </div>

      <div class="flex items-center gap-3 flex-shrink-0">
        <div class="flex bg-gray-900 border border-gray-800 rounded-lg p-1 gap-1">
          <button id="btn-view-card" onclick="switchView('card')" class="p-2 rounded text-gray-400 hover:text-white transition">
            <span class="material-symbols-outlined text-base block">grid_view</span>
          </button>
          <button id="btn-view-table" onclick="switchView('table')" class="p-2 rounded text-gray-400 hover:text-white transition">
            <span class="material-symbols-outlined text-base block">table_rows</span>
          </button>
        </div>

        <button onclick="openBookmarkModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2 rounded-lg flex items-center gap-2 transition shadow-lg shadow-indigo-600/20">
          <span class="material-symbols-outlined text-lg">add_link</span>
          <span class="hidden sm:inline">Add Bookmark</span>
        </button>
      </div>
    </header>

    <div class="flex-grow p-6 overflow-y-auto no-scrollbar">
      <div id="bookmark-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

      <div id="bookmark-table-container" class="hub-card rounded-xl border border-gray-800 overflow-hidden hidden">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-gray-800 bg-gray-900/50 text-xs font-semibold text-gray-400 uppercase tracking-wider">
              <th class="p-3.5 pl-4">Title</th>
              <th class="p-3.5">Category</th>
              <th class="p-3.5">URL</th>
              <th class="p-3.5 pr-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="bookmark-table-body" class="divide-y divide-gray-800/60 text-sm"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODALS -->
  <div id="cat-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="hub-card w-full max-w-sm rounded-2xl p-6 space-y-4">
      <h3 class="text-base font-bold text-white flex items-center gap-2">
        <span class="material-symbols-outlined text-indigo-400">category</span> Manage Category
      </h3>
      <div>
        <label class="text-xs text-gray-400 block mb-1">Category Name</label>
        <input type="text" id="cat-name" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 text-gray-200">
      </div>
      <div>
        <label class="text-xs text-gray-400 block mb-1">Tag Color</label>
        <input type="color" id="cat-color" value="#6366f1" class="w-full h-10 bg-gray-900 border border-gray-800 rounded-lg cursor-pointer">
      </div>
      <div class="flex gap-2 justify-end pt-2">
        <button onclick="closeCategoryModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-white">Cancel</button>
        <button onclick="saveCategory()" class="px-5 py-2 text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg">Save</button>
      </div>
    </div>
  </div>

  <div id="bm-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="hub-card w-full max-w-md rounded-2xl p-6 space-y-4">
      <h3 class="text-base font-bold text-white flex items-center gap-2">
        <span class="material-symbols-outlined text-indigo-400">add_circle</span> Add New Bookmark
      </h3>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-gray-400 block mb-1">Target URL</label>
          <input type="url" id="bm-url" onblur="autoFetchTitle()" placeholder="https://..." class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 text-gray-200">
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="text-xs text-gray-400">Bookmark Title</label>
            <span id="title-loading" class="text-xs text-indigo-400 hidden">Auto fetching...</span>
          </div>
          <input type="text" id="bm-title" placeholder="Title auto-filled or type manually" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 text-gray-200">
        </div>
        <div>
          <label class="text-xs text-gray-400 block mb-1">Category</label>
          <select id="bm-category" class="w-full bg-gray-900 border border-gray-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 text-gray-300"></select>
        </div>
      </div>
      <div class="flex gap-2 justify-end pt-2">
        <button onclick="closeBookmarkModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-white">Cancel</button>
        <button onclick="saveBookmark()" class="px-5 py-2 text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg">Save Bookmark</button>
      </div>
    </div>
  </div>

  <script>
    let state = { categories: [], bookmarks: [], selectedCat: null, currentView: 'card' };
    let isCollapsed = false;

    // --- WEBSOCKET REALTIME KẾT NỐI SANG WORKER ---
    function initWebSocket() {
      const wsUrl = 'wss://bookmarks-ws.nguyenhuy-1981-hcm.workers.dev';
      const ws = new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        console.log('⚡ Realtime sync received:', event.data);
        fetchData(); // Tự cập nhật lại danh sách khi tab khác thêm/xóa
      };

      ws.onclose = () => setTimeout(initWebSocket, 3000); // Tự kết nối lại nếu rớt
    }

    const sidebar = document.getElementById('sidebar');
    const resizer = document.getElementById('resizer');
    let isResizing = false;

    resizer.addEventListener('mousedown', () => { isResizing = true; document.body.style.cursor = 'col-resize'; });
    window.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      if (e.clientX > 72 && e.clientX < 450) sidebar.style.width = e.clientX + 'px';
    });
    window.addEventListener('mouseup', () => { isResizing = false; document.body.style.cursor = 'default'; });

    function toggleSidebar() {
      isCollapsed = !isCollapsed;
      const texts = document.querySelectorAll('.sidebar-content');
      const icon = document.getElementById('toggle-icon');
      if (isCollapsed) {
        sidebar.dataset.prevWidth = sidebar.style.width;
        sidebar.style.width = '72px';
        texts.forEach(el => el.classList.add('hidden'));
        icon.style.transform = 'rotate(180deg)';
      } else {
        sidebar.style.width = sidebar.dataset.prevWidth || '260px';
        texts.forEach(el => el.classList.remove('hidden'));
        icon.style.transform = 'rotate(0deg)';
      }
    }

    function switchView(mode) {
      state.currentView = mode;
      const grid = document.getElementById('bookmark-grid');
      const table = document.getElementById('bookmark-table-container');
      const btnCard = document.getElementById('btn-view-card');
      const btnTable = document.getElementById('btn-view-table');

      if (mode === 'card') {
        grid.classList.remove('hidden');
        table.classList.add('hidden');
        btnCard.classList.add('bg-indigo-600', 'text-white');
        btnTable.classList.remove('bg-indigo-600', 'text-white');
      } else {
        grid.classList.add('hidden');
        table.classList.remove('hidden');
        btnTable.classList.add('bg-indigo-600', 'text-white');
        btnCard.classList.remove('bg-indigo-600', 'text-white');
      }
    }

    function copyUrl(url, btnElement) {
      navigator.clipboard.writeText(url).then(() => {
        const iconSpan = btnElement.querySelector('.material-symbols-outlined');
        const oldIcon = iconSpan.innerText;
        iconSpan.innerText = 'check';
        iconSpan.classList.add('text-emerald-400');
        setTimeout(() => { iconSpan.innerText = oldIcon; iconSpan.classList.remove('text-emerald-400'); }, 2000);
      });
    }

    async function fetchData() {
      try {
        const [catRes, bmRes] = await Promise.all([fetch('/api/categories'), fetch('/api/bookmarks')]);
        if (!catRes.ok || !bmRes.ok) throw new Error();
        state.categories = await catRes.json();
        state.bookmarks = await bmRes.json();
      } catch(e) {
        state.categories = []; state.bookmarks = [];
      }
      renderCategories();
      renderBookmarks();
    }

    function renderCategories() {
      const list = document.getElementById('category-list');
      const select = document.getElementById('bm-category');
      list.innerHTML = state.categories.map(c => `
        <div class="group flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium text-gray-300 hover:bg-gray-800/60 cursor-pointer ${state.selectedCat === c.id ? 'bg-indigo-600/10 text-indigo-400 font-semibold' : ''}" onclick="filterCategory(${c.id})">
          <div class="flex items-center gap-3 truncate">
            <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${c.color}"></span>
            <span class="sidebar-content truncate">${c.name}</span>
          </div>
        </div>
      `).join('');
      select.innerHTML = state.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    function renderBookmarks() {
      const grid = document.getElementById('bookmark-grid');
      const tableBody = document.getElementById('bookmark-table-body');
      const search = document.getElementById('search-input').value.toLowerCase();

      const filtered = state.bookmarks.filter(b => {
        const matchCat = state.selectedCat ? b.category_id === state.selectedCat : true;
        const matchSearch = b.title.toLowerCase().includes(search) || b.url.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });

      grid.innerHTML = filtered.map(b => `
        <div class="hub-card p-5 rounded-xl hover:border-indigo-500/50 transition duration-200 flex flex-col justify-between group">
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-mono px-2.5 py-1 rounded-md border font-semibold" style="color: ${b.category_color || '#818cf8'}; border-color: ${b.category_color}44; background-color: ${b.category_color}1a">
                ${b.category_name || 'General'}
              </span>
              <div class="flex items-center gap-1">
                <button onclick="copyUrl('${b.url}', this)" title="Copy URL" class="p-1.5 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-white transition">
                  <span class="material-symbols-outlined text-lg">content_copy</span>
                </button>
                <a href="${b.url}" target="_blank" title="Open Tab" class="p-1.5 hover:bg-gray-800 rounded-lg text-gray-400 hover:text-indigo-400 transition">
                  <span class="material-symbols-outlined text-lg">open_in_new</span>
                </a>
              </div>
            </div>
            <h4 class="text-sm font-semibold text-white group-hover:text-indigo-300 line-clamp-2 leading-relaxed">${b.title}</h4>
          </div>
          <p class="text-xs text-gray-400 truncate mt-4 font-mono">${b.url}</p>
        </div>
      `).join('');

      tableBody.innerHTML = filtered.map(b => `
        <tr class="hover:bg-gray-800/30 transition">
          <td class="p-3.5 pl-4 font-medium text-white truncate max-w-[220px]">${b.title}</td>
          <td class="p-3.5">
            <span class="text-xs font-mono px-2 py-0.5 rounded-md border" style="color: ${b.category_color || '#818cf8'}; border-color: ${b.category_color}33">
              ${b.category_name || 'General'}
            </span>
          </td>
          <td class="p-3.5 font-mono text-gray-400 truncate max-w-[280px]">${b.url}</td>
          <td class="p-3.5 pr-4 text-right">
            <div class="flex items-center justify-end gap-1">
              <button onclick="copyUrl('${b.url}', this)" title="Copy URL" class="p-1.5 hover:bg-gray-800 rounded text-gray-400 hover:text-white transition">
                <span class="material-symbols-outlined text-lg">content_copy</span>
              </button>
              <a href="${b.url}" target="_blank" title="Open Tab" class="p-1.5 hover:bg-gray-800 rounded text-gray-400 hover:text-indigo-400 transition">
                <span class="material-symbols-outlined text-lg">open_in_new</span>
              </a>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterCategory(catId) { state.selectedCat = catId; renderCategories(); renderBookmarks(); }
    function openCategoryModal() { document.getElementById('cat-modal').classList.remove('hidden'); }
    function closeCategoryModal() { document.getElementById('cat-modal').classList.add('hidden'); }
    function openBookmarkModal() { document.getElementById('bm-modal').classList.remove('hidden'); }
    function closeBookmarkModal() { document.getElementById('bm-modal').classList.add('hidden'); }

    async function saveCategory() {
      const name = document.getElementById('cat-name').value;
      const color = document.getElementById('cat-color').value;
      if (!name) return;
      await fetch('/api/categories', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name, color}) });
      closeCategoryModal();
      fetchData();
    }

    async function saveBookmark() {
      const title = document.getElementById('bm-title').value;
      const url = document.getElementById('bm-url').value;
      const category_id = parseInt(document.getElementById('bm-category').value);
      if (!title || !url) return;
      await fetch('/api/bookmarks', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({title, url, category_id}) });
      closeBookmarkModal();
      fetchData();
    }

    async function autoFetchTitle() {
      const url = document.getElementById('bm-url').value;
      const titleInput = document.getElementById('bm-title');
      const loader = document.getElementById('title-loading');
      if (!url || titleInput.value) return;
      loader.classList.remove('hidden');
      try {
        const res = await fetch(`/api/fetch-title?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        if (data.title) titleInput.value = data.title;
      } catch(e) {} finally { loader.classList.add('hidden'); }
    }

    fetchData();
    initWebSocket(); // Kích hoạt kết nối WebSocket Realtime ngay khi load trang
  </script>
</body>
</html>
